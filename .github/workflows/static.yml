name: Publicar la Guía del TCP
on:
  push:
    branches: [main]
    paths:
      - guia.zip
      - .github/workflows/static.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Preparar la guía
        run: |
          unzip -q guia.zip -d sitio
          test -s sitio/index.html
          test -s sitio/arranque-sw.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: sitio
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
